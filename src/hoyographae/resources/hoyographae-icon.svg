      <stop offset="0.40" stop-color="#e7c477"/>
      <stop offset="0.72" stop-color="#c28d46"/>
      <stop offset="1" stop-color="#8e6337"/>
    </linearGradient>
    <linearGradient id="train_body_v2" x1="700" y1="192" x2="861" y2="267" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#344472"/>
      <stop offset="0.48" stop-color="#162441"/>
