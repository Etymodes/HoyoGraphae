      <stop offset="0.34" stop-color="#8bc9ed"/>
      <stop offset="0.70" stop-color="#587caf"/>
      <stop offset="1" stop-color="#32466f"/>
    </radialGradient>
    <linearGradient id="wrench_gold_v2" x1="454" y1="516" x2="545" y2="739" gradientUnits="userSpaceOnUse">
