      <stop offset="1" stop-color="#9aaeff"/>
    </linearGradient>
    <linearGradient id="glyph_v2" x1="332" y1="292" x2="710" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#edfaff"/>
      <stop offset="1" stop-color="#a7e2ff"/>
    </linearGradient>
    <linearGradient id="paimon_sclera_v2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#b9ddf1"/>
    </linearGradient>
    <radialGradient id="paimon_iris_v2" cx="0.34" cy="0.28" r="0.76">
