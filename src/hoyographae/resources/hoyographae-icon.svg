<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:i="http://ns.adobe.com/AdobeIllustrator/10.0/"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  version="1.1">
  <title>HoyoGraphae — HOYOG fantasy and mechanical monogram</title>
  <desc>Editable HOYOG monogram. A decorated fantasy H sits above two paired blue sprite eyes and a contrasting mechanical wrench Y. The outer G remains spatially separated from both eyes and gradually transforms into an original star-rail locomotive at its upper-right terminal. All systems are separated into named Illustrator and Inkscape layers. Pure vector; no fonts, raster images, clipping paths, masks, or filters.</desc>

  <defs>
    <linearGradient id="bg_v2" x1="116" y1="96" x2="908" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070d29"/>
      <stop offset="0.42" stop-color="#20255f"/>
      <stop offset="0.72" stop-color="#24468e"/>
      <stop offset="1" stop-color="#0878b5"/>
    </linearGradient>
    <linearGradient id="nebula_violet_v2" x1="86" y1="126" x2="570" y2="514" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a78ed" stop-opacity="0.46"/>
      <stop offset="0.54" stop-color="#5e5ac8" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#4346a2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nebula_cyan_v2" x1="466" y1="902" x2="920" y2="494" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36c2ee" stop-opacity="0.16"/>
